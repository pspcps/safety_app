{% extends "base.html" %}
{% block body %}
<h1>Analyze media</h1>
<form method="post" enctype="multipart/form-data" class="panel upload">
  <label>Video or still image <input name="file" type="file" accept=".mp4,.mov,.webm,.mkv,.png,.jpg,.jpeg" required></label>
  <small>{{ formats }} · 100 MiB · 120 seconds · up to 240 samples</small>
  <label>Camera view
    <select name="category"><option value="in_cabin">In-cabin</option><option value="road">Road-facing</option></select>
  </label>
  <label>Samples per second <input type="number" name="fps" value="1" min="1" max="{{ max_fps }}" required></label>
  <button>Queue analysis</button>
</form>
<section id="recent" hidden>
  <h2>Recent jobs in this browser</h2>
  <ul id="jobs"></ul>
</section>
<script>
try {
  const storage = JSON.parse(localStorage.getItem("safetyJobs") || "{}");
  for (const [path, name] of Object.entries(storage).reverse()) {
    if (!/^\/jobs\/[0-9a-f-]{36}$/.test(path)) continue;
    const item = document.createElement("li");
    const link = document.createElement("a");
    link.href = path;
    link.textContent = name;
    item.append(link);
    document.querySelector("#jobs").append(item);
    document.querySelector("#recent").hidden = false;
  }
} catch {}
</script>
{% endblock %}
